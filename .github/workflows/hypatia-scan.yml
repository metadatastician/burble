# This workflow is managed by gh actions-lock.
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      # Required by upload-sarif in the pinned reusable workflow.
      security-events: write
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@0f2d9b5447d3d6e56b41fe69d54e834849d7c932
    secrets: inherit
