# web-client-tests.yml — web-client test suite (Bun)
#
# Bun is the estate's default runner as of 2026-10. This is the only runner
# here: one job, the whole suite at client/web/tests/ — 12 files, 97 tests —
# including the four suites that spawn helper servers (relay rendezvous, AI
# bridge API, bridge security, bridge round-trip). Those used to be Deno-only
# because they called `new Deno.Command("deno", …)`; they now go through
# `spawnServer()` in tests/runner.js, which uses `Bun.spawn`. The servers
# themselves (signaling/relay.js, client/web/burble-ai-bridge.js) go through
# signaling/runtime.js, which uses Bun.serve.
#
# There is deliberately no Deno job. Deno used to run ten of these twelve files
# in a `continue-on-error` job, which is how the suite could be "green" while
# five files failed at import. One runner, nothing advisory, no second path to
# keep in sync.
#
# Tests exercise the compiled ReScript output (*.res.mjs) for now;
# AffineScript-output parity is tracked by affinescript-canary.yml
# and graduates to required-for-merge when STATE.a2ml Phase 5 closes.
#
# Closes the second acceptance bullet of #48:
#   "CI runs the client suite on every PR"

name: Web Client Tests
on:
  pull_request:
    branches: ['**']
    paths:
      - 'client/web/**'
      - 'client/lib/**'
      - 'signaling/**'
      - '.github/workflows/web-client-tests.yml'
  push:
    branches: [main, master]
    paths:
      - 'client/web/**'
      - 'client/lib/**'
      - 'signaling/**'
      - '.github/workflows/web-client-tests.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bun-tests:
    name: Bun test — client/web (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      # Two manifests, two installs: client/lib is the published package, so it
      # carries its own pin of the ReScript toolchain plus `phoenix`; client/web
      # consumes those artifacts. Both locks are committed, so `--frozen-lockfile`
      # turns "someone edited package.json and forgot the lock" into a red job
      # rather than a surprise at release time.
      - name: Install dependencies (client/web)
        working-directory: client/web
        run: bun install --frozen-lockfile
      - name: Install dependencies (client/lib)
        working-directory: client/lib
        run: bun install --frozen-lockfile
      - name: Build ReScript (client/web)
        working-directory: client/web
        run: bun run res:build
      # client/lib ships its compiled output in-tree (deno.json `publish.include`
      # lists src/**/*.res.mjs), and its README tells contributors not to
      # hand-edit it. Rebuild here and fail on drift, so "don't hand-edit"
      # is enforced rather than merely requested.
      - name: Verify client/lib artifacts match sources
        working-directory: client/lib
        run: |
          bun run res:build
          # `git diff` cannot see a NEW file: a generated *.res.mjs that has
          # never been committed appears in neither the worktree diff nor the
          # index. That is not hypothetical — BurbleLOL.res.mjs sat untracked
          # for weeks while this step reported clean, and the published package
          # was missing it. `git status` sees added, modified and deleted alike.
          drift="$(git status --porcelain --untracked-files=all -- src)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo "::error title=Stale client/lib artifacts::src/**/*.res.mjs does not match src/**/*.res. Run 'bun run res:build' in client/lib and commit the regenerated output."
            exit 1
          fi
      - name: Run the web-client suite
        working-directory: client/web
        run: bun test tests/
      - name: Summarise
        if: always()
        run: |
          echo "## Web client test run (Bun)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All suites under \`client/web/tests/\` run under Bun, including" >> "$GITHUB_STEP_SUMMARY"
          echo "the four that spawn relay/bridge helper servers." >> "$GITHUB_STEP_SUMMARY"
          echo "Tests exercise the compiled ReScript output (\`*.res.mjs\`). The" >> "$GITHUB_STEP_SUMMARY"
          echo "parallel \`.affine\` source tree is exercised separately by" >> "$GITHUB_STEP_SUMMARY"
          echo "\`affinescript-canary.yml\`; this workflow graduates to gating the" >> "$GITHUB_STEP_SUMMARY"
          echo ".affine build once STATE.a2ml Phase 5 closes." >> "$GITHUB_STEP_SUMMARY"
