# web-client-tests.yml — Deno-based web-client test suite
#
# Runs the web-client tests at client/web/tests/ on every PR (10 suites as of
# 2026-10-21: room names, relay rendezvous + CORS, signaling, WebRTC offer/
# answer, AI bridge API + security + round-trip).
# Tests exercise the compiled ReScript output (*.res.mjs) for now;
# AffineScript-output parity is tracked by affinescript-canary.yml
# and graduates to required-for-merge when STATE.a2ml Phase 5 closes.
#
# Closes the second acceptance bullet of #48:
#   "CI runs the client suite on every PR"

name: Web Client Tests
on:
  pull_request:
    branches: ['**']
    paths:
      - 'client/web/**'
      - '.github/workflows/web-client-tests.yml'
  push:
    branches: [main, master]
    paths:
      - 'client/web/**'
      - '.github/workflows/web-client-tests.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DENO_VERSION: 'v2.x'
jobs:
  deno-tests:
    name: Deno test — client/web (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory mode. The stale-import reason this originally carried no longer
    # applies: signaling_test.js and voice_test.js import the committed
    # client/lib/src/BurbleSignaling.res.mjs and BurbleVoice.res.mjs, which
    # exist (the client/web-internal modules are Room.res / Signaling.res /
    # WebRTC.res, and those tests import those). Remaining blockers to flipping
    # this to gating are environmental rather than code: the Deno test task
    # needs npm:phoenix and @rescript/core resolvable, so it must run after
    # `deno task res:build` (it does) and with the repo's deno.json import map
    # intact. Verify a green run, then drop continue-on-error. Tracked on #48.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Build ReScript (compiles .res to .res.mjs for tests)
        working-directory: client/web
        run: deno task res:build
      - name: Run web-client tests
        working-directory: client/web
        run: deno task test
      - name: Summarise
        if: always()
        run: |
          echo "## Web client test run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests live under \`client/web/tests/\` and exercise the compiled" >> "$GITHUB_STEP_SUMMARY"
          echo "ReScript output (\`*.res.mjs\`). The parallel \`.affine\` source" >> "$GITHUB_STEP_SUMMARY"
          echo "tree is exercised separately by \`affinescript-canary.yml\`;" >> "$GITHUB_STEP_SUMMARY"
          echo "this workflow graduates to gating the .affine build once" >> "$GITHUB_STEP_SUMMARY"
          echo "STATE.a2ml Phase 5 closes." >> "$GITHUB_STEP_SUMMARY"
