# This workflow is managed by gh actions-lock.
name: CodeQL Security Analysis
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 1 * *' # monthly 1st 06:00 UTC
# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool.
#
# Not on `push` and not on the monthly `schedule`, though. Those are the runs
# that populate the code-scanning dashboard for the commit that is actually on
# `main`: a second push used to cancel them mid-flight, which is why this
# workflow's history is success 6 / cancelled 6 over its last fifteen runs. A
# cancelled analysis is not a clean analysis — it uploads nothing, and CodeQL's
# whole value here is the baseline that the next PR is compared against.
# Cancelling a superseded *pull request* run is always safe; cancelling the
# run that owns `main` is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.38.2 (4.38.1 blocked estate-wide; nexia-list#100)
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.38.2 (4.38.1 blocked estate-wide; nexia-list#100)
        with:
          category: "/language:${{ matrix.language }}"
