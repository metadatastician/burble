#
# conformance.yml — the DEED–K9 conformance lanes, and the grid they post.
#
# Both lanes are the canonical implementations, called from hyperpolymath/standards
# at a pinned SHA rather than reimplemented here, so the validator that judges this
# repository is the one the estate reviews:
#
#   deed-conformance.yml — lints every committed *.deed with 1-formats/deed/tools/deed_lint.js
#   k9-conformance.yml   — runs 1-formats/k9/tools/k9-validate.sh, layers L0–L2, over every
#                          *.k9 and *.k9.ncl, typechecks the normative contract, and renders
#                          the five-state verdict grid
#
# The grid (red / orange / yellow / green / grey) is docs/VERDICT-GRID-SPEC.adoc's
# conformance family: one row per category, a count of results rather than lines of
# log, an embedded baseline so the next revision can say what moved, and an artifact
# holding the evidence. `k9-verdict` posts it as one comment per pull request,
# regenerated in place under its marker.
#
# There is no badge job. Publishing `badges/k9.json` to a `governance-badges`
# branch needed `contents: write`, and a write-scoped job in a file that runs on
# pull requests scores 0 on the estate's token-permissions check — it turned the
# only green-able check on this pull request red, for a picture. The grid
# comment already carries its own shields badge line, derived from the verdict,
# so the endpoint bought nothing. See DEBT C-10 for what a badge branch would
# need (a push-only workflow and a token that is not the workflow's own).
#
# The old per-ecosystem validators in dogfood-gate.yml (`Validate A2ML manifests`,
# `Validate K9 contracts`) are NOT the same gate: they are the ecosystem actions,
# permissive (`strict: 'false'`) and pinned to a different tool. They are left in
# place until the DEED migration lands — the A2ML lane still has 102 `.a2ml` files
# to retire (DEBT CODE-1c), and deleting its validator before the files are converted
# would turn a visible pass into silence.

name: DEED-K9 conformance

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deed:
    name: Validate DEED manifests
    uses: hyperpolymath/standards/.github/workflows/deed-conformance.yml@01c9b0c9f2646ebea0b30a9588462642ac94aee9
    with:
      # burble_chora.deed is the repository's own deed; a run that finds no deed
      # at all should fail rather than pass silently.
      require-files: true

  k9:
    name: Validate K9 contracts
    # The lane reads the grid comment it posted on the previous revision to fill
    # the "since previous revision" column, hence pull-requests: read. It asks
    # for nothing else: a reusable cannot be granted more than its caller holds.
    permissions:
      contents: read
      pull-requests: read
    uses: hyperpolymath/standards/.github/workflows/k9-conformance.yml@01c9b0c9f2646ebea0b30a9588462642ac94aee9
    with:
      require-files: true
      fail-on-indeterminate: false

  k9-verdict:
    name: Post the K9 verdict grid
    needs: k9
    # A fork or Dependabot pull request gets a read-only token, so posting would
    # fail; the grid itself still runs in `k9`. The pull request's author — not
    # github.actor, which is whoever triggered the run — identifies Dependabot.
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.k9.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the grid
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        # The lane uploads the grid whenever it rendered one. A lane that died
        # before rendering has nothing to post, and says so below.
        continue-on-error: true
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid

      - name: Create or update the grid comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GRID: ${{ runner.temp }}/k9-grid/report.md
          MARKER: '<!-- verdict-grid:k9 regenerated on every run -->'
        run: |
          set -euo pipefail
          if [ ! -s "$GRID" ]; then
            echo "::warning::the k9-grid artifact holds no report.md; the lane did not render a grid, see its job"
            exit 0
          fi
          comment_id="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq -r --arg m "$MARKER" \
                '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($m)))] | last | .id // ""')"
          jq -n --rawfile body "$GRID" '{body: $body}' > "$RUNNER_TEMP/k9-comment.json"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$RUNNER_TEMP/k9-comment.json" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/k9-comment.json" >/dev/null
          fi
