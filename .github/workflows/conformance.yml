#
# conformance.yml — the DEED–K9 conformance lanes, and the grid they post.
#
# Both lanes are the canonical implementations, called from hyperpolymath/standards
# at a pinned SHA rather than reimplemented here, so the validator that judges this
# repository is the one the estate reviews:
#
#   deed-conformance.yml — lints every committed *.deed with 1-formats/deed/tools/deed_lint.js
#   k9-conformance.yml   — runs 1-formats/k9/tools/k9-validate.sh, layers L0–L2, over every
#                          *.k9 and *.k9.ncl, typechecks the normative contract, and renders
#                          the five-state verdict grid
#
# The grid (red / orange / yellow / green / grey) is docs/VERDICT-GRID-SPEC.adoc's
# conformance family: one row per category, a count of results rather than lines of
# log, an embedded baseline so the next revision can say what moved, and an artifact
# holding the evidence. `k9-verdict` posts it as one comment per pull request,
# regenerated in place under its marker; `badges` publishes the shields endpoint
# schema to the `governance-badges` branch on main.
#
# The old per-ecosystem validators in dogfood-gate.yml (`Validate A2ML manifests`,
# `Validate K9 contracts`) are NOT the same gate: they are the ecosystem actions,
# permissive (`strict: 'false'`) and pinned to a different tool. They are left in
# place until the DEED migration lands — the A2ML lane still has 102 `.a2ml` files
# to retire (DEBT CODE-1c), and deleting its validator before the files are converted
# would turn a visible pass into silence.

name: DEED-K9 conformance

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deed:
    name: Validate DEED manifests
    uses: hyperpolymath/standards/.github/workflows/deed-conformance.yml@0d47b89259128962bc0609f223dbff559724bfb1
    with:
      # burble_chora.deed is the repository's own deed; a run that finds no deed
      # at all should fail rather than pass silently.
      require-files: true

  k9:
    name: Validate K9 contracts
    # The lane reads the grid comment it posted on the previous revision to fill
    # the "since previous revision" column, hence pull-requests: read. It asks
    # for nothing else: a reusable cannot be granted more than its caller holds.
    permissions:
      contents: read
      pull-requests: read
    uses: hyperpolymath/standards/.github/workflows/k9-conformance.yml@0d47b89259128962bc0609f223dbff559724bfb1
    with:
      require-files: true
      fail-on-indeterminate: false

  k9-verdict:
    name: Post the K9 verdict grid
    needs: k9
    # A fork or Dependabot pull request gets a read-only token, so posting would
    # fail; the grid itself still runs in `k9`. The pull request's author — not
    # github.actor, which is whoever triggered the run — identifies Dependabot.
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.k9.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the grid
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        # The lane uploads the grid whenever it rendered one. A lane that died
        # before rendering has nothing to post, and says so below.
        continue-on-error: true
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid

      - name: Create or update the grid comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GRID: ${{ runner.temp }}/k9-grid/report.md
          MARKER: '<!-- verdict-grid:k9 regenerated on every run -->'
        run: |
          set -euo pipefail
          if [ ! -s "$GRID" ]; then
            echo "::warning::the k9-grid artifact holds no report.md; the lane did not render a grid, see its job"
            exit 0
          fi
          comment_id="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq -r --arg m "$MARKER" \
                '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($m)))] | last | .id // ""')"
          jq -n --rawfile body "$GRID" '{body: $body}' > "$RUNNER_TEMP/k9-comment.json"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$RUNNER_TEMP/k9-comment.json" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/k9-comment.json" >/dev/null
          fi

  badges:
    name: Publish the K9 badge
    needs: k9
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.k9.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the grid
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid

      - name: Publish badges/k9.json to the governance-badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE: ${{ runner.temp }}/k9-grid/badge.json
          BRANCH: governance-badges
          DEST: badges/k9.json
        run: |
          set -euo pipefail
          if [ ! -s "$BADGE" ]; then
            echo "::warning::the k9-grid artifact holds no badge.json; nothing to publish"
            exit 0
          fi
          jq -e 'type == "object" and has("schemaVersion")' "$BADGE" >/dev/null
          content="$(base64 -w0 "$BADGE")"
          message="badges: K9 grid at ${GITHUB_SHA:0:12}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$DEST?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
            jq -n --arg c "$content" --arg s "$sha" --arg b "$BRANCH" --arg m "$message" \
              '{message: $m, content: $c, branch: $b} + (if $s != "" then {sha: $s} else {} end)' > "$RUNNER_TEMP/put.json"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$DEST" --input "$RUNNER_TEMP/put.json" >/dev/null
          else
            # First publication: an orphan branch holding only the badge, made
            # through the contents API so the commit is GitHub-signed and no
            # checkout is written to.
            jq -n --arg c "$content" '{content: $c, encoding: "base64"}' > "$RUNNER_TEMP/blob.json"
            blob="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)"
            jq -n --arg b "$blob" --arg p "$DEST" '{tree: [{path: $p, mode: "100644", type: "blob", sha: $b}]}' > "$RUNNER_TEMP/tree.json"
            tree="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree.json" --jq .sha)"
            jq -n --arg t "$tree" --arg m "$message" '{message: $m, tree: $t, parents: []}' > "$RUNNER_TEMP/commit.json"
            commit="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" --input "$RUNNER_TEMP/commit.json" --jq .sha)"
            jq -n --arg s "$commit" --arg r "refs/heads/$BRANCH" '{ref: $r, sha: $s}' > "$RUNNER_TEMP/ref.json"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/ref.json" >/dev/null
          fi
          echo "published $DEST on $BRANCH"
