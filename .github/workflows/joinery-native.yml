# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
# Test this PR/merge-group revision against the reviewed counterpart commit.
# Linux native signaling and GTK lifecycle only: NOT microphone/camera media.
name: Joinery native acceptance
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: joinery-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native pairing and GTK lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MIX_ENV: test
      GOSSAMER_CHECKOUT: ${{ github.workspace }}/gossamer
    steps:
      - name: Isolate build tools and evidence
        run: |
          {
            echo "MIX_DEPS_PATH=$RUNNER_TEMP/joinery/deps"
            echo "MIX_BUILD_PATH=$RUNNER_TEMP/joinery/build"
            echo "HEX_HOME=$RUNNER_TEMP/joinery/hex"
            echo "PAIRING_ARTIFACT_DIR=$RUNNER_TEMP/joinery/acceptance"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          path: burble
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: metadatastician/gossamer
          # Includes the full-width, 32-bit-safe lease/counter implementation;
          # native acceptance passed on this exact Gossamer revision.
          ref: d9ac9890e7d7b2a7ea0379206936df23d2c9fe45
          path: gossamer
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '27.3.4.2'
          elixir-version: '1.17.3'
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: '0.15.2'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Install native build and headless-display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl libssl-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth
      - name: Record both exact revisions and toolchains
        run: |
          git -C burble rev-parse HEAD
          git -C gossamer rev-parse HEAD
          zig version
          elixir --version
          bun --version
          echo "ZIG=$(command -v zig)" >> "$GITHUB_ENV"
      - name: Real endpoint pairing and authenticated voice adapter
        working-directory: burble/server
        run: bash integration/check_gossamer_pairing.sh
      - name: Real GTK window, signaling lifecycle and cancellation
        working-directory: burble/server
        run: xvfb-run -a bash integration/check_gossamer_host.sh
      - name: Require dependency lockfile stability
        run: git -C burble diff --exit-code -- server/mix.lock
