# This workflow is managed by gh actions-lock.
# Elixir CI — test-pass evidence for CRG grade C.
name: Elixir CI
on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]
permissions:
  actions: read
  contents: read
jobs:
  test:
    name: Test (OTP 27 / Elixir 1.17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/
    steps:
      - name: Checkout
        # No submodules: this job only builds ffi/zig and runs the server
        # suite, neither of which uses tools/affinescript — and that
        # submodule's pinned commit is currently unreachable upstream
        # ("upload-pack: not our ref"), which was hard-failing checkout
        # before any test could run.
        uses: actions/checkout@v7.0.1
      - name: Set up Beam (OTP 27 + Elixir 1.17)
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - name: Set up Zig 0.15
        # v2.2.1, not the old v1.2.2: v1.x predates Zig's post-0.14 tarball
        # rename (zig-linux-x86_64- -> zig-x86_64-linux-) and still probes
        # ziglang.org/builds (nightlies) instead of /download/<ver>/, so it
        # 404s on every Zig >= 0.14 regardless of the version string. v2.x
        # uses the community-mirror list + modern download index.
        uses: mlugg/setup-zig@v2.2.1
        with:
          # Exact published tag (not 'latest') for deterministic CI;
          # tracks ffi/zig/build.zig's declared "Zig 0.15".
          version: '0.15.2'
      - name: Install just
        uses: taiki-e/install-action@v2.87.0
        with:
          # Pin an explicit modern just: the Justfile uses `import?`
          # (optional import, just >= 1.19.0). Unversioned `tool: just`
          # resolves via this action's bundled manifest, which shipped
          # just 1.14.0 -> `error: Unknown start of token` at
          # `import? "contractile.just"`, so `mix test --no-start`
          # never ran (root cause of the dead Elixir gate, burble#39).
          tool: just@1.34.0
      - name: Install system prerequisites for quicer/msquic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake perl build-essential libssl-dev
      - name: Cache Mix dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            server/deps
            server/_build
          key: ${{ runner.os }}-mix-msquic-v2.3.8-${{ hashFiles('server/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-msquic-v2.3.8-
            ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get --check-locked
      - name: Test Zig kernels (SNIF guest sources)
        working-directory: ${{ github.workspace }}
        # Application-owned in-VM NIFs are forbidden. These sources remain Zig,
        # and production acceleration is permitted only as ReleaseSafe WASM via
        # SNIF once the buffer ABI proof and guest artifacts exist.
        run: cd ffi/zig && zig build test -Doptimize=ReleaseSafe
      - name: Run server tests
        working-directory: ${{ github.workspace }}
        # GATE RE-ARMED 2026-07-07: every pre-existing failure cluster is
        # fixed (LLM singleton stop/start app-collapse cascade, RTSP socket
        # ownership + instance threading, Groove :pop state wipe, Packet
        # format_mac, ProvenBridge constant_time_eq?, Timing drift/wraparound,
        # Topology, Store init-retry ladder, typing-throttle monotonic bug,
        # circuit-breaker test drift). A failing test turns this job red —
        # this is the CRG grade-C test-pass-evidence artefact (#35/#39).
        run: just test-server
      - name: Run Rust client tests
        working-directory: ${{ github.workspace }}
        run: cargo test --locked --manifest-path client/rust/Cargo.toml
      - name: Bebop codegen gate (generator must run; drift reported)
        working-directory: ${{ github.workspace }}
        # Check A (ARMED): the generator must parse every .bop schema and
        # emit output — this catches the 2026-07-28 finding that
        # `mix bebop.generate` crashed and the codecs could not be reproduced
        # from their own sources. Check B (REPORT ONLY): byte-identity vs the
        # committed codecs, which cannot pass until the hand-enriched-docs
        # question is settled — see the script header. Restores the committed
        # files afterwards, so it never mutates the tree.
        run: ./scripts/check-bebop-codegen.sh
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    defaults:
      run:
        working-directory: server/
    steps:
      - name: Checkout
        # No submodules — same rationale as the test job above.
        uses: actions/checkout@v7.0.1
      - name: Set up Beam (OTP 27 + Elixir 1.17)
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - name: Install system prerequisites for quicer/msquic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake perl build-essential libssl-dev
      - name: Restore PLT cache
        uses: actions/cache@v6.1.0
        id: plt-cache
        with:
          path: server/priv/plts
          key: ${{ runner.os }}-dialyzer-plt-otp27-elixir1.17-msquic-v2.3.8-${{ hashFiles('server/mix.lock', 'server/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-plt-otp27-elixir1.17-msquic-v2.3.8-
            ${{ runner.os }}-dialyzer-plt-otp27-elixir1.17-
      - name: Cache Mix dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            server/deps
            server/_build
          key: ${{ runner.os }}-mix-msquic-v2.3.8-${{ hashFiles('server/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-msquic-v2.3.8-
            ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get --check-locked
      - name: Compile
        run: mix compile
      - name: Create PLT directory
        run: mkdir -p priv/plts
      - name: Run Dialyzer (report-only legacy baseline)
        # The PLT directory is configured through Dialyxir's supported
        # `plt_local_path` project option. `--plt-file` is not a Dialyxir CLI
        # option: it was forwarded as an invalid Dialyzer warning flag, and
        # `continue-on-error` then hid that the analyser never ran.
        # The analyser now genuinely executes. Keep the repository's existing
        # findings visible but non-blocking until they have been triaged into
        # fixes or narrow, documented suppressions.
        continue-on-error: true
        run: mix dialyzer --format github
