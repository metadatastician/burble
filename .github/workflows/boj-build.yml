name: BoJ Server Build Trigger
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  trigger-boj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Trigger BoJ Server (Casket/ssg-mcp)
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Advisory trigger: the internal endpoint may be unavailable to a
          # GitHub-hosted runner, but the shell and JSON must still be valid.
          payload=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            '{repo: $repo, branch: $branch, engine: "casket"}')
          curl --fail-with-body --request POST \
            "http://boj-server.local:7700/cartridges/ssg-mcp/invoke" \
            --header "Content-Type: application/json" \
            --data "$payload"
        continue-on-error: true
permissions:
  actions: read
  contents: read
