name: OSSF Scorecard

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@0f2d9b5447d3d6e56b41fe69d54e834849d7c932
    permissions:
      contents: read
      security-events: write
      id-token: write
