name: OSSF Scorecard

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@fcb566cfb8a86cea2d3666bf65a4f177a49b1313
    permissions:
      contents: read
      security-events: write
      id-token: write
