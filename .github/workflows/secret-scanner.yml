# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@fcb566cfb8a86cea2d3666bf65a4f177a49b1313
    # The current reusable uses checksum-verified scanner binaries and needs
    # only contents:read. Keep the caller least-privileged so future reusable
    # widening cannot silently inherit write access.
    secrets: inherit
  # (The standalone trufflehog job was removed: the standards reusable's
  # gitleaks + rust-secrets + shell-secrets jobs are the canonical scan, and
  # standards dropped trufflehog as redundant. It was also failing on the
  # trufflehog-action's BASE==HEAD quirk, not on any real finding.)
