# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@7641c7fdb01420696b5420ab85d88f599f32f609
    # This full-SHA reusable uses checksum-verified scanner binaries and needs
    # only contents:read. It declares no workflow_call secrets, so do not pass
    # secrets (including inherit). Keep both permission grants least-privileged
    # so future reusable widening cannot silently inherit additional access.
  # (The standalone trufflehog job was removed: the standards reusable's
  # gitleaks + rust-secrets + shell-secrets jobs are the canonical scan, and
  # standards dropped trufflehog as redundant. It was also failing on the
  # trufflehog-action's BASE==HEAD quirk, not on any real finding.)
