# Inherit the pinned estate baseline staged by secret-scanner-reusable.yml.
[extend]
path = ".gitleaks-estate.toml"

[allowlist]
description = "Exact published BLE-SPA v1 conformance values, never production credentials"
# Derived from the public test-invite-room-alpha/bravo strings by
# mix burble.gen_ble_vectors. No file or hexadecimal key class is exempted:
# another credential in the same vector file must still fail the scanner.
# Five exact values are accounted for below; keep the negative-control test
# in Workflow safety so expanding this allowlist cannot blind a whole file.
regexes = [
  '''^b73d0f8b2aefa65ac5c64d526f0e97399810f533971f732030c32c5224eff090$''',
  '''^d1c73bce7f5251cdc559cb2063ca6e424917a29faccf1ca27c89daae0ec64233$''',
  # Response HMACs derived from the above keys and fixed timestamps/nonces.
  '''^9d948106cd6166204dfe72296b03caa1$''',
  '''^612b2828d522816ab4fc20e14f427bd1$''',
  # Published contact-c byte-walk fixture for the presence-beacon vectors.
  '''^00112233445566778899aabbccddeeff0102030405060708090a0b0c0d0e0f10$''',
  # E2EE cross-language test vectors (client/web/tests/fixtures/e2ee-vectors.json,
  # generated by scripts/gen-e2ee-vectors.exs). The two private keys are the
  # RFC 7748 §6.1 X25519 test vectors, published for exactly this purpose; every
  # other value is derived from them by the shipped protocol and is reproducible
  # with `node scripts/verify-e2ee-vectors.mjs`.
  #
  # Matched as substrings, not ^...$, because generic-api-key captures trailing
  # punctuation: a JSON line `"pairwise_key": "abc...",` yields the secret
  # `abc...",`, so an anchored pattern would not match. Each value below still
  # names one exact piece of public test material; no file and no rule class is
  # exempted, so a real credential in the same file still fails the scan.
  '''77076d0a7318a57d3c16c17251b26645df4c2f87ebc0992ab177fba51db92c2a''',
  '''5dab087e624a8a4b79e17f8b83800ee66f3bb1292618b6fd1c2f8b27ff88e0eb''',
  '''8520f0098930a754748b7ddcb43ef75a0dbf3a0d26381af4eba4a98eaa9b4e6a''',
  '''de9edb7d7b7dc1b4d35b61c2ece435373f8343c85b78674dadfc7e146f882b4f''',
  '''000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f''',
  '''c4418f7929454ae8a6d55fc9e7982066934e8b2f5441d4eff310368e4ccda2d1''',
  '''c226fc3445d812235b3e2c8cf306c9e714ade8a9ffc8648f98b734e2d8afacd5''',
  '''148b30c43b6fd1035684414eca2dfc847dff19936c6ea89d40663457831c760e''',
  '''HsKvmp3zaAz4fsaf/ZqP99m5BtkU33y6z\+E\+HgSTrElsK3UZOsSxJpDyQWjvw6msDRaS5GSpPnGBrXcM''',
